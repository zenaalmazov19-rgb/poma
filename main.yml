name: Сборка APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Распаковать готовый проект
        run: |
          rm -rf project
          mkdir project
          unzip -q AdBlockAndroid-source-fixed.zip -d project

      - name: Проверить проект
        working-directory: project
        run: |
          echo "=== build.gradle.kts ==="
          cat build.gradle.kts
          echo "=== app/build.gradle.kts ==="
          cat app/build.gradle.kts
          echo "=== gradle.properties ==="
          cat gradle.properties

      - name: Собрать APK
        working-directory: project
        run: gradle assembleDebug

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: AdBlockAndroid-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
