name: Сборка APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Распаковать проект
        run: |
          rm -rf project
          mkdir project
          unzip -q AdBlockAndroid-source.zip -d project

      - name: Подключить Compose Compiler
        working-directory: project
        run: |
          sed -i '/id("org.jetbrains.kotlin.android") version "2.0.21" apply false/a\    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false' build.gradle.kts
          sed -i '/id("org.jetbrains.kotlin.android")/a\    id("org.jetbrains.kotlin.plugin.compose")' app/build.gradle.kts

      - name: Собрать APK
        working-directory: project
        run: gradle assembleDebug

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: AdBlockAndroid-debug
          path: project/app/build/outputs/apk/debug/app-debug.apk
