name: Сборка APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Распаковать проект
        run: |
          unzip -o AdBlockAndroid-source.zip -d project
          find project -maxdepth 3 -type f | head -50

      - name: Настроить Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать APK
        working-directory: project
        run: gradle assembleDebug

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: AdBlockAndroid-APK
          path: project/**/build/outputs/apk/debug/*.apk
